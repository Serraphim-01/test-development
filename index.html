<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Doc</title>
</head>
<body>
    <h1>Test Heading</h1>
    <p>This is a test paragraph.</p>
    <ul>
        <li>List item 1</li>
        <li>List item 2</li>
        <li>List item 3</li>
    </ul>
    <ol>
        <li>Ordered item 1</li>
        <li>Ordered item 2</li>
        <li>Ordered item 3</li>
    </ol>
    <a href="#">This is a test link</a>
    <img src="https://via.placeholder.com/150" alt="Test Image">
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <input type="submit" value="Submit">
    </form>
    <button type="button">Test Button</button>
    <input type="checkbox" id="testCheckbox" name="testCheckbox">
    <label for="testCheckbox">Test Checkbox</label>
    <br>
    <input type="radio" id="testRadio" name="testRadio">
    <label for="testRadio">Test Radio</label>
    <br>
    <select id="testSelect" name="testSelect">
        <option value="option1">Option 1</option>
        <option value="option2">Option 2</option>
        <option value="option3">Option 3</option>
    </select>
    <br>
    <textarea id="testTextarea" name="testTextarea" rows="4" cols="50"></textarea>
    <br>
    <label for="testColor">Test Color:</label>
    <input type="color" id="testColor" name="testColor">
    
</body>
</html>
